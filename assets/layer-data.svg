<text x="48" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#fff">Data</text>
<text x="50" y="98" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" opacity=".9">What remembers: relational schemas, transactions and locks that keep data correct.</text>
