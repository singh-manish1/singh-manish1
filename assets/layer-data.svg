<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t d">
<title id="t">Data layer</title><desc id="d">Data layer. A table row is locked with SELECT FOR UPDATE, its status changes from paused to active, and the transaction commits.</desc>
<style>.hl{opacity:0;animation:hl 5.2s linear infinite}@keyframes hl{0%,15%{opacity:0}20%,75%{opacity:.55}80%,100%{opacity:0}}
.lk{opacity:0;animation:lk 5.2s linear infinite}@keyframes lk{0%,18%{opacity:0}22%,72%{opacity:1}76%,100%{opacity:0}}
.old{animation:old 5.2s linear infinite}@keyframes old{0%,45%{opacity:1}48%,96%{opacity:0}100%{opacity:1}}
.new{opacity:0;animation:nw 5.2s linear infinite}@keyframes nw{0%,45%{opacity:0}48%,96%{opacity:1}100%{opacity:0}}
.sql1{opacity:0;animation:s1 5.2s linear infinite}@keyframes s1{0%,15%{opacity:0}20%,45%{opacity:1}48%,100%{opacity:0}}
.sql2{opacity:0;animation:s2 5.2s linear infinite}@keyframes s2{0%,46%{opacity:0}50%,75%{opacity:1}80%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
