<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">How this README works</title><desc id="d">Clicking a seat opens an issue (the request). A GitHub Action (the server) books it with optimistic locking, saves it to data/state.json (the database) and re-renders this README (the UI). So far: 0 requests, 0 seats booked, 0 double bookings stopped, 0 bad requests turned away.</desc>
<style>.pkt{animation:pkt 6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes pkt{0%{transform:translateX(0);opacity:0}6%{opacity:1}20%,26%{transform:translateX(232px)}44%,58%{transform:translateX(464px)}72%,78%{transform:translateX(696px)}94%{transform:translateX(928px);opacity:1}100%{transform:translateX(928px);opacity:0}}
.lock{animation:lock 6s linear infinite}@keyframes lock{0%,42%{opacity:.25}46%,58%{opacity:1}62%,100%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="340" fill="#F6F8F8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1C2433"/></marker></defs><rect x="40" y="70" width="192" height="104" rx="16" fill="#F3D08A" stroke="#1C2433" stroke-opacity=".25"/><text x="60" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#1C2433">You</text><text x="60" y="144" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1C2433">click a free seat</text><path d="M238,122 L266,122" stroke="#1C2433" stroke-width="2" marker-end="url(#arrow)"/><rect x="272" y="70" width="192" height="104" rx="16" fill="#A9B66E" stroke="#1C2433" stroke-opacity=".25"/><text x="292" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#1C2433">Request</text><text x="292" y="144" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1C2433">an issue: book A1</text><path d="M470,122 L498,122" stroke="#1C2433" stroke-width="2" marker-end="url(#arrow)"/><rect x="504" y="70" width="192" height="104" rx="16" fill="#E0AE4C" stroke="#1C2433" stroke-opacity=".25"/><text x="524" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#1C2433">Server</text><text x="524" y="144" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1C2433">GitHub Action, Node.js</text><path d="M702,122 L730,122" stroke="#1C2433" stroke-width="2" marker-end="url(#arrow)"/><rect x="736" y="70" width="192" height="104" rx="16" fill="#7C8C99" stroke="#1C2433" stroke-opacity=".25"/><text x="756" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#1C2433">Database</text><text x="756" y="144" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1C2433">data/state.json</text><path d="M934,122 L962,122" stroke="#1C2433" stroke-width="2" marker-end="url(#arrow)"/><rect x="968" y="70" width="192" height="104" rx="16" fill="#E3ECEF" stroke="#1C2433" stroke-opacity=".25"/><text x="988" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#1C2433">UI</text><text x="988" y="144" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1C2433">README re-rendered</text><g class="lock" transform="translate(656,84)"><rect x="0" y="9" width="22" height="17" rx="3" fill="#1C2433"/><path d="M5,9 V5 a6,6 0 0 1 12,0 V9" fill="none" stroke="#1C2433" stroke-width="2.6"/></g><text x="504" y="202" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#4A5568">retries if the data changed</text><text x="736" y="202" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#4A5568">git push = compare-and-swap</text><circle class="pkt" cx="136" cy="174" r="9" fill="#12B5CB" stroke="#fff" stroke-width="2.5"/><text x="40" y="296" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C2433">0</text><text x="77" y="290" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4A5568">requests served</text><text x="330" y="296" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C2433">0</text><text x="367" y="290" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4A5568">seats booked</text><text x="620" y="296" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C2433">0</text><text x="657" y="290" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4A5568">double bookings stopped (409)</text><text x="910" y="296" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C2433">0</text><text x="947" y="290" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4A5568">bad requests turned away (400)</text><line x1="40" y1="244" x2="1160" y2="244" stroke="rgba(28,36,51,.14)"/>
</g></svg>