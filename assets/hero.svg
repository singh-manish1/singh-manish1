<text x="56" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#1C2433" letter-spacing="-1">Manish Singh</text><text x="60" y="132" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#4A5568">Full stack engineer. I build the screen, the API behind it and the database under that.</text><rect x="56" y="168" width="410" height="272" rx="14" fill="#F6F8F8" stroke="rgba(28,36,51,.14)"/><rect x="512" y="168" width="632" height="272" rx="14" fill="#F6F8F8" stroke="rgba(28,36,51,.14)"/><text x="76" y="196" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5568">Request</text><text x="532" y="196" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5568">Response</text><text x="76" y="232" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#1C2433"><tspan class="v0">G</tspan><tspan class="v1">E</tspan><tspan class="v2">T</tspan><tspan class="v3"> </tspan><tspan class="v4">/</tspan><tspan class="v5">s</tspan><tspan class="v6">i</tspan><tspan class="v7">n</tspan><tspan class="v8">g</tspan><tspan class="v9">h</tspan><tspan class="v10">-</tspan><tspan class="v11">m</tspan><tspan class="v12">a</tspan><tspan class="v13">n</tspan><tspan class="v14">i</tspan><tspan class="v15">s</tspan><tspan class="v16">h</tspan><tspan class="v17">1</tspan><tspan class="v18"> </tspan><tspan class="v19">H</tspan><tspan class="v20">T</tspan><tspan class="v21">T</tspan><tspan class="v22">P</tspan><tspan class="v23">/</tspan><tspan class="v24">2</tspan></text><text class="v25" x="76" y="260" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#4A5568">Host: github.com</text><text class="v26" x="76" y="288" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#4A5568">Accept: application/json</text><path d="M466,304 L512,304" stroke="#1C2433" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 5"/><circle class="pk" cx="466" cy="304" r="7" fill="#12B5CB" stroke="#fff" stroke-width="2"/><text class="v27" x="532" y="232" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#5E8C4A" font-weight="700">HTTP/2 200 OK</text><text class="v28" x="532" y="262" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">{</tspan><tspan fill="#1C2433"></tspan></text><text class="v29" x="532" y="284" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">  &quot;name&quot;: </tspan><tspan fill="#1C2433">&quot;Manish Singh&quot;,</tspan></text><text class="v30" x="532" y="306" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">  &quot;role&quot;: </tspan><tspan fill="#1C2433">&quot;Full stack engineer&quot;,</tspan></text><text class="v31" x="532" y="328" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">  &quot;client&quot;: </tspan><tspan fill="#1C2433">[&quot;React&quot;, &quot;Next.js&quot;, &quot;React Native&quot;],</tspan></text><text class="v32" x="532" y="350" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">  &quot;server&quot;: </tspan><tspan fill="#1C2433">[&quot;Node.js&quot;, &quot;REST&quot;, &quot;tRPC&quot;, &quot;Server Actions&quot;],</tspan></text><text class="v33" x="532" y="372" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">  &quot;data&quot;: </tspan><tspan fill="#1C2433">[&quot;PostgreSQL&quot;, &quot;Prisma&quot;, &quot;Drizzle&quot;],</tspan></text><text class="v34" x="532" y="394" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">  &quot;now&quot;: </tspan><tspan fill="#1C2433">&quot;Software Engineer @ Appbrew&quot;</tspan></text><text class="v35" x="532" y="416" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#5E6E7B">}</tspan><tspan fill="#1C2433"></tspan></text><g class="v36"><rect class="cur" x="550" y="402" width="9" height="17" fill="#1C2433"/></g><text x="60" y="466" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1C2433">Scroll down and open any layer of the stack. Everything opens right here on the page.</text>
