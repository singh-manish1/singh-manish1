<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t d">
<title id="t">API layer</title><desc id="d">API layer. A POST request travels from the client to the API, passes validation and 201 Created travels back.</desc>
<style>.req{opacity:0;animation:req 4.4s ease-in-out infinite}@keyframes req{0%{opacity:0;transform:translateX(0)}5%{opacity:1}35%{opacity:1;transform:translateX(130px)}38%,100%{opacity:0;transform:translateX(130px)}}
.chk{opacity:0;animation:chk 4.4s linear infinite}@keyframes chk{0%,36%{opacity:0}40%,58%{opacity:1}62%,100%{opacity:0}}
.res{opacity:0;animation:res 4.4s ease-in-out infinite}@keyframes res{0%,56%{opacity:0;transform:translateX(0)}60%{opacity:1}90%{opacity:1;transform:translateX(-130px)}95%,100%{opacity:0;transform:translateX(-130px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><clipPath id="clip"><rect width="1200" height="150" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="150" fill="#E0AE4C"/>
<text x="48" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#1C2433">API</text>
<text x="50" y="98" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1C2433" opacity=".9">What answers: typed, validated endpoints with auth checked on every request.</text>
<text x="50" y="128" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1C2433" opacity=".65">Click to open</text>
<rect x="770" y="49" width="110" height="52" rx="12" fill="#F3D08A" stroke="#1C2433" stroke-opacity=".3"/>
<text x="825" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1C2433">client</text>
<rect x="1030" y="49" width="110" height="52" rx="12" fill="#F6F8F8" stroke="#1C2433" stroke-opacity=".3"/>
<text x="1085" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1C2433">API</text>
<line x1="884" y1="75" x2="1026" y2="75" stroke="#1C2433" stroke-opacity=".25" stroke-width="2"/>
<g class="req"><circle cx="890" cy="75" r="7" fill="#12B5CB"/><text x="890" y="61" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#1C2433">POST /members</text></g>
<g class="chk"><rect x="1048" y="107" width="74" height="22" rx="11" fill="#5E8C4A"/><text x="1085" y="122" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#fff">zod ok</text></g>
<g class="res"><circle cx="1020" cy="75" r="7" fill="#F2C14E" stroke="#1C2433"/><text x="1020" y="101" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#1C2433">201 Created</text></g>
</g></svg>