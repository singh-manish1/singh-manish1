<title id="t">Rachnakaar: What happens when a writer publishes a story</title><desc id="d">Step 1 (Client): Writer hits Publish, Rich text in any Indian script. Step 2 (API): Signed-in check, Clerk auth. Step 3 (API): Title and body validated, Nothing malformed is saved. Step 4 (Data): Story saved with Prisma, Linked to writer and contest.</desc>
