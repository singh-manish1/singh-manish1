<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t d">
<title id="t">Ops layer</title><desc id="d">Ops layer. A pipeline lights up step by step: lint, test, build, deploy, then all checks passed.</desc>
<style>.p0{opacity:0;animation:p0 5s linear infinite}@keyframes p0{0%,8%{opacity:0}12%,90%{opacity:1}96%,100%{opacity:0}}
.p1{opacity:0;animation:p1 5s linear infinite}@keyframes p1{0%,26%{opacity:0}30%,90%{opacity:1}96%,100%{opacity:0}}
.p2{opacity:0;animation:p2 5s linear infinite}@keyframes p2{0%,44%{opacity:0}48%,90%{opacity:1}96%,100%{opacity:0}}
.p3{opacity:0;animation:p3 5s linear infinite}@keyframes p3{0%,62%{opacity:0}66%,90%{opacity:1}96%,100%{opacity:0}}
.done{opacity:0;animation:dn 5s linear infinite}@keyframes dn{0%,68%{opacity:0}72%,90%{opacity:1}96%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><clipPath id="clip"><rect width="1200" height="150" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="150" fill="#2E3150"/>
<text x="48" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#fff">Ops</text>
<text x="50" y="98" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" opacity=".9">What keeps it running: auth, payments, email, tests and deploys.</text>
<text x="50" y="128" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fff" opacity=".65">Click to open</text>
<rect x="760" y="60" width="80" height="32" rx="16" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".35"/><rect class="p0" x="760" y="60" width="80" height="32" rx="16" fill="#5E8C4A"/><text x="800" y="81" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#fff">lint</text><line x1="840" y1="76" x2="858" y2="76" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><rect x="858" y="60" width="80" height="32" rx="16" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".35"/><rect class="p1" x="858" y="60" width="80" height="32" rx="16" fill="#5E8C4A"/><text x="898" y="81" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#fff">test</text><line x1="938" y1="76" x2="956" y2="76" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><rect x="956" y="60" width="80" height="32" rx="16" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".35"/><rect class="p2" x="956" y="60" width="80" height="32" rx="16" fill="#5E8C4A"/><text x="996" y="81" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#fff">build</text><line x1="1036" y1="76" x2="1054" y2="76" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><rect x="1054" y="60" width="80" height="32" rx="16" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".35"/><rect class="p3" x="1054" y="60" width="80" height="32" rx="16" fill="#5E8C4A"/><text x="1094" y="81" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#fff">deploy</text><text class="done" x="760" y="126" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff">All checks passed. Shipped.</text>
</g></svg>