name: Book a seat

# The server side of the README: every issue titled "book <seat>" is a request.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  book:
    if: startsWith(github.event.issue.title, 'book') && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Optimistic concurrency: book against the latest state, push, and if another
      # booking landed first the push is rejected, so start over on fresh data.
      - name: Book against the latest state
        run: |
          git config user.name "seat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/book.mjs
            git add data/state.json README.md assets
            git commit -q -m "Seat request #${{ github.event.issue.number }}: $(cat result.txt)"
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "state changed under us, retrying"
            sleep $((attempt * 2))
          done
          echo "gave up after 6 attempts" >&2
          exit 1

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file reply.md
          gh issue close "$ISSUE"
